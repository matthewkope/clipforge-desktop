<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipForge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 7.5h8M8 12h8M8 16.5h5" />
          </svg>
        </span>
        <div>
          <strong>ClipForge</strong>
          <small>Send media to the desktop app</small>
        </div>
      </header>

      <section class="formats" aria-label="Download format">
        <button class="format-option selected" type="button" data-format="mp4" aria-label="Video, MP4" title="Video · MP4">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="14" height="12" rx="2" />
            <path d="m17 10 4-2v8l-4-2" />
          </svg>
          <small>MP4</small>
        </button>
        <button class="format-option" type="button" data-format="mp3" aria-label="Audio, MP3" title="Audio · MP3">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l10-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="16" cy="16" r="3" />
          </svg>
          <small>MP3</small>
        </button>
        <button class="format-option" type="button" data-format="markdown" aria-label="Transcript, Markdown" title="Transcript · Markdown">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6M8 13h8M8 17h6" />
          </svg>
          <small>MD</small>
        </button>
      </section>

      <section class="preset-bar inactive">
        <label class="preset-toggle" for="use-preset">
          <input id="use-preset" type="checkbox" />
          <span>Use preset</span>
        </label>
        <select id="preset" aria-label="Saved preset" disabled>
          <option>No presets saved</option>
        </select>
      </section>

      <section class="actions" aria-label="Download source">
        <button id="clipboard" class="action-circle" type="button" disabled>
          <span class="circle">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 5h6M9 3h6v4H9zM7 5H5v16h14V5h-2" />
            </svg>
          </span>
          <span>Paste URL</span>
        </button>
        <button id="active-tab" class="action-circle" type="button" disabled>
          <span class="circle gradient">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5h11v11M19 5 9 15M16 19H5V8" />
            </svg>
          </span>
          <span>Current tab</span>
        </button>
      </section>

      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
